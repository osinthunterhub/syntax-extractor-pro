services:
  - type: web
    name: independent-appx-classplus-extractor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: EXPECTED_BOT_USERNAME
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: APPX_API_HOSTS
        sync: false
      - key: SET_WEBHOOK
        value: "false"
